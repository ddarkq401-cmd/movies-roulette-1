            if (movieTitles.length === 0) {

                }
                counterSpan.innerText = movieTitles.length;
                rankDiv.innerText = "الترتيب: -";
                resultDiv.innerText = "اضغط لفتح فيلم الليلة!";
                return;
            }

            spinBtn.disabled = true;
            let clicks = 0;
            
            let interval = setInterval(() => {
                let randomTemp = Math.floor(Math.random() * 250) + 1;
                rankDiv.innerText = `الترتيب: #${randomTemp}`;
                resultDiv.innerText = "جاري الاختيار...";

                    clearInterval(interval);

                    movieTitles.splice(randomIndex, 1);
